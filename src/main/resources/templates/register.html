<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<main class="container py-5">
    <h1 class=text-primary>"Create an account"</h1>

    <form th:action="@{/register}"
          th:object="${registrationData}"
          method="post"
          class="mx-auto"
          style="max-width: 520px;">

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <div class="mb-3">
            <label class="form-label text-primary" for="email">Email</label>
            <input class="form-control" id="email" type="email" th:field="*{email}">
            <p class="text-danger small"
               th:if="${#fields.hasErrors('email')}"
               th:errors="*{email}"></p>
        </div>

        <div class="mb-3">
            <label class="form-label text-primary" for="firstName">First name</label>
            <input class="form-control" id="firstName" type="text" th:field="*{firstName}">
            <p class="text-danger small"
               th:if="${#fields.hasErrors('firstName')}"
               th:errors="*{firstName}"></p>
        </div>

        <div class="mb-3">
            <label class="form-label text-primary" for="lastName">Last name</label>
            <input class="form-control" id="lastName" type="text" th:field="*{lastName}">
            <p class="text-danger small"
               th:if="${#fields.hasErrors('lastName')}"
               th:errors="*{lastName}"></p>
        </div>

        <div class="mb-3">
            <label class="form-label text-primary" for="password">Password</label>
            <input class="form-control" id="password" type="password" th:field="*{password}">
            <p class="text-danger small"
               th:if="${#fields.hasErrors('password')}"
               th:errors="*{password}"></p>
        </div>

        <div class="mb-3" >
            <label class="form-label text-primary" for="confirmPassword">Confirm password</label>
            <input class="form-control" id="confirmPassword"
                   type="password"
                   th:field="*{confirmPassword}">
            <p class="text-danger small"
               th:if="${#fields.hasErrors('confirmPassword')}"
               th:errors="*{confirmPassword}"></p>
        </div>

        <button class="text-primary" type="submit">Create account</button>
    </form>

    <p><a th:href="@{/login}">Already have an account? Log in</a></p>
    <p><a th:href="@{/}">Back to home</a></p>
</main>
</body>
</html>
